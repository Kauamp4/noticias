<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TechNews - Notícias, novidades, lançamentos, tendências e games de tecnologia.">
    <title>TechNews</title>

    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- FONTE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>
        /* =====================================================
           VARIÁVEIS
        ===================================================== */
        :root {
            --primary: #00d9ff;
            --primary-dark: #00a9c7;
            --background: #f5f7fa;
            --surface: #ffffff;
            --surface-2: #eef2f5;
            --text: #111820;
            --text-secondary: #66717d;
            --border: #dfe5ea;
        }

        /* =====================================================
           RESET
        ===================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            overflow-x: hidden;
            transition: background .3s ease, color .3s ease;
        }

        button,
        input {
            font-family: inherit;
        }

        /* =====================================================
           ACESSIBILIDADE
        ===================================================== */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* =====================================================
           BARRA DE CATEGORIAS
        ===================================================== */
        .barra-categorias {
            position: relative;
            z-index: 500;
            width: 100%;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 3px 15px rgba(0, 0, 0, .05);
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }

        .barra-categorias::-webkit-scrollbar {
            height: 4px;
        }

        .barra-categorias::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 20px;
        }

        .barra-categorias ul {
            width: 100%;
            max-width: 1400px;
            min-width: max-content;
            margin: 0 auto;
            padding: 0 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 42px;
            list-style: none;
        }

        .barra-categorias li {
            flex-shrink: 0;
        }

        .barra-categorias a {
            position: relative;
            display: block;
            padding: 16px 2px 15px;
            color: var(--text);
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            white-space: nowrap;
            transition: color .25s ease, transform .25s ease;
        }

        .barra-categorias a::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 7px;
            height: 3px;
            border-radius: 20px;
            background: linear-gradient(90deg, #00d9ff, #8e44ad, #ff0080);
            transform: scaleX(0);
            transform-origin: center;
            transition: transform .3s ease;
        }

        .barra-categorias a:hover {
            color: transparent;
            background: linear-gradient(90deg, #00d9ff, #8e44ad, #ff0080, #00d9ff);
            background-size: 300% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradienteLink 2.5s linear infinite;
            transform: translateY(-1px);
        }

        .barra-categorias a:hover::after {
            transform: scaleX(1);
        }

        @keyframes gradienteLink {
            0% {
                background-position: 0% 50%;
            }

            100% {
                background-position: 300% 50%;
            }
        }

        /* =====================================================
           HEADER
        ===================================================== */
        header {
            position: relative;
            z-index: 400;
            width: 100%;
            min-height: 88px;
            background: radial-gradient(circle at 50% -150px, rgba(0, 217, 255, .20), transparent 45%), linear-gradient(135deg, #05080c 0%, #0a1118 45%, #111a23 100%);
            border-bottom: 1px solid rgba(0, 217, 255, .25);
            box-shadow: 0 12px 40px rgba(0, 0, 0, .30);
            isolation: isolate;
        }

        header::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(90deg, transparent, rgba(0, 217, 255, .04), transparent);
            z-index: -1;
        }

        header::after {
            content: "";
            position: absolute;
            left: 15%;
            right: 15%;
            bottom: -1px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #00d9ff, transparent);
            box-shadow: 0 0 18px rgba(0, 217, 255, .55);
            pointer-events: none;
        }

        /* =====================================================
           TOPO
        ===================================================== */
        .topo {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1400px;
            min-height: 88px;
            margin: 0 auto;
            padding: 0 25px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            column-gap: 25px;
        }

        /* =====================================================
           LADO ESQUERDO
        ===================================================== */
        .topo-esquerdo {
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* =====================================================
           MENU HAMBÚRGUER
        ===================================================== */
        .menu-hamburguer {
            position: relative;
            flex-shrink: 0;
        }

        .hamburguer {
            width: 46px;
            height: 46px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 13px;
            background: rgba(255, 255, 255, .06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: .25s ease;
        }

        .hamburguer:hover {
            background: rgba(0, 217, 255, .12);
            border-color: rgba(0, 217, 255, .5);
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(0, 217, 255, .15);
        }

        .hamburguer span {
            width: 23px;
            height: 2px;
            border-radius: 20px;
            background: var(--primary);
            transition: .25s ease;
        }

        .hamburguer.ativo span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .hamburguer.ativo span:nth-child(2) {
            opacity: 0;
        }

        .hamburguer.ativo span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        /* =====================================================
           MENU
        ===================================================== */
        .menu {
            position: absolute;
            top: calc(100% + 12px);
            left: 0;
            width: 285px;
            max-height: calc(100vh - 115px);
            overflow-y: auto;
            padding: 9px;
            list-style: none;
            background: rgba(10, 16, 22, .98);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 16px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, .55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transform: translateY(-10px) scale(.97);
            transform-origin: top left;
            transition: opacity .2s ease, visibility .2s ease, transform .2s ease;
        }

        .menu.ativo {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transform: translateY(0) scale(1);
        }

        .menu li {
            list-style: none;
        }

        /* =====================================================
           TÍTULO MENU
        ===================================================== */
        .menu-titulo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 13px 10px;
            color: #fff;
            font-size: 15px;
            font-weight: 900;
            border-bottom: 1px solid rgba(255, 255, 255, .1);
            margin-bottom: 5px;
        }

        .menu-titulo i {
            color: var(--primary);
        }

        /* =====================================================
           OPÇÕES MENU
        ===================================================== */
        .menu a,
        .menu button.menu-opcao {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 13px;
            margin: 2px 0;
            border: 0;
            border-radius: 10px;
            color: #e9eef3;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            background: transparent;
            cursor: pointer;
            text-align: left;
            transition: .2s ease;
        }

        .menu a i,
        .menu button.menu-opcao i {
            width: 21px;
            flex-shrink: 0;
            color: var(--primary);
            text-align: center;
        }

        .menu a:hover,
        .menu button.menu-opcao:hover {
            background: rgba(0, 217, 255, .12);
            color: #fff;
            transform: translateX(3px);
        }

        .menu-opcao.ativo {
            background: rgba(0, 217, 255, .16);
            color: #fff;
        }

        .menu-opcao .status {
            margin-left: auto;
            color: #8d9aa5;
            font-size: 10px;
            font-weight: 800;
        }

        /* =====================================================
           SUBMENU DALTONISMO
        ===================================================== */
        .submenu-acessibilidade {
            display: none;
            padding: 5px 7px 7px;
            margin-bottom: 4px;
            border-radius: 10px;
            background: rgba(255, 255, 255, .04);
        }

        .submenu-acessibilidade.ativo {
            display: block;
        }

        .submenu-acessibilidade button {
            width: 100%;
            padding: 9px 10px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #d9e1e7;
            cursor: pointer;
            text-align: left;
            font-size: 12px;
        }

        .submenu-acessibilidade button:hover {
            background: rgba(0, 217, 255, .14);
            color: #fff;
        }

        .submenu-acessibilidade button.ativo {
            background: rgba(0, 217, 255, .28);
            color: #fff;
            font-weight: 900;
            box-shadow: inset 3px 0 0 var(--primary);
        }

        .submenu-acessibilidade button.ativo::before {
            content: "✓ ";
            color: var(--primary);
        }

        /* =====================================================
           SEPARADOR
        ===================================================== */
        .menu-separador {
            height: 1px;
            margin: 7px 4px;
            background: rgba(255, 255, 255, .1);
        }

        /* =====================================================
           RESTAURAR
        ===================================================== */
        .menu-restaurar {
            color: #ff9b9b !important;
        }

        .menu-restaurar i {
            color: #ff6b6b !important;
        }

        /* =====================================================
           BUSCA
        ===================================================== */
        .buscar-topo {
            position: relative;
            width: 210px;
            max-width: 100%;
        }

        .buscar-topo input {
            width: 100%;
            height: 42px;
            padding: 0 44px 0 17px;
            border: 1px solid rgba(255, 255, 255, .14);
            border-radius: 24px;
            outline: none;
            color: #fff;
            background: rgba(255, 255, 255, .07);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: width .3s ease, border .3s ease, background .3s ease, box-shadow .3s ease;
        }

        .buscar-topo input::placeholder {
            color: #aeb7c1;
        }

        .buscar-topo input:focus {
            width: 270px;
            border-color: rgba(0, 217, 255, .7);
            background: rgba(255, 255, 255, .11);
            box-shadow: 0 0 0 3px rgba(0, 217, 255, .12);
        }

        .limpar-busca {
            position: absolute;
            right: 8px;
            top: 50%;
            width: 27px;
            height: 27px;
            display: none;
            align-items: center;
            justify-content: center;
            transform: translateY(-50%);
            border: 0;
            border-radius: 50%;
            background: transparent;
            color: #adb6bf;
            cursor: pointer;
        }

        .limpar-busca.visivel {
            display: flex;
        }

        .limpar-busca:hover {
            color: #fff;
            background: rgba(255, 255, 255, .12);
        }

        /* =====================================================
           LOGO
        ===================================================== */
        .logo {
            position: relative;
            display: inline-block;
            color: #00ddff;
            font-size: clamp(31px, 4vw, 47px);
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1;
            text-transform: uppercase;
            user-select: none;
            text-decoration: none;
            white-space: nowrap;
            text-shadow: 0 0 22px rgba(0, 217, 255, .22);
            transition: .25s ease;
        }

        .logo span {
            color: #fff;
        }

        .logo:hover {
            transform: translateY(-2px);
            text-shadow: 0 0 30px rgba(0, 217, 255, .45);
        }

        .logo::after {
            content: "";
            position: absolute;
            left: 2px;
            bottom: -11px;
            width: 38px;
            height: 3px;
            border-radius: 10px;
            background: linear-gradient(90deg, var(--primary), transparent);
        }

        /* =====================================================
           LOGIN
        ===================================================== */
        .login {
            justify-self: end;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 42px;
            padding: 0 18px;
            border: 1px solid rgba(0, 217, 255, .35);
            border-radius: 23px;
            background: rgba(0, 217, 255, .08);
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .7px;
            white-space: nowrap;
            transition: .25s ease;
        }

        .login i {
            color: var(--primary);
            transition: .25s ease;
        }

        .login:hover {
            color: #061016;
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 217, 255, .3);
        }

        .login:hover i {
            color: #061016;
        }

        /* =====================================================
           MODAL
        ===================================================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, .7);
            backdrop-filter: blur(5px);
        }

        .modal-overlay.ativo {
            display: flex;
        }

        .modal-atalhos {
            width: min(520px, 100%);
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
            border: 1px solid var(--border);
            border-radius: 18px;
            background: var(--surface);
            color: var(--text);
            box-shadow: 0 25px 70px rgba(0, 0, 0, .4);
        }

        .modal-cabecalho {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .modal-cabecalho h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
        }

        .modal-cabecalho h2 i {
            color: var(--primary);
        }

        .fechar-modal {
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 50%;
            background: var(--surface-2);
            color: var(--text);
            cursor: pointer;
            transition: .2s ease;
        }

        .fechar-modal:hover {
            background: var(--primary);
            color: #061016;
            transform: rotate(90deg);
        }

        .atalhos-lista {
            display: grid;
            gap: 8px;
        }

        .atalho-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 11px 13px;
            border-radius: 9px;
            background: var(--surface-2);
        }

        .atalho-item span {
            font-size: 13px;
        }

        .atalho-item kbd {
            min-width: 70px;
            padding: 5px 8px;
            border: 1px solid var(--border);
            border-bottom-width: 3px;
            border-radius: 6px;
            background: var(--surface);
            color: var(--text);
            text-align: center;
            font-size: 11px;
            font-weight: 900;
        }

        /* =====================================================
           LINKS DESTACADOS
        ===================================================== */
        body.destacar-links a {
            text-decoration: underline !important;
            text-decoration-thickness: 2px !important;
            text-underline-offset: 4px;
        }

        body.destacar-links a:hover,
        body.destacar-links a:focus {
            background: #fff36a !important;
            color: #111 !important;
            text-decoration-thickness: 3px !important;
        }

        /* =====================================================
           RESPONSIVIDADE - 1100PX
        ===================================================== */
        @media (max-width: 1100px) {
            .topo {
                padding: 0 20px;
                column-gap: 15px;
            }

            .buscar-topo {
                width: 180px;
            }

            .buscar-topo input:focus {
                width: 220px;
            }

            .barra-categorias ul {
                gap: 32px;
            }
        }

        /* =====================================================
           RESPONSIVIDADE - 800PX
        ===================================================== */
        @media (max-width: 800px) {
            .topo {
                grid-template-columns: 1fr auto 1fr;
                padding: 0 15px;
            }

            .buscar-topo {
                width: 150px;
            }

            .buscar-topo input:focus {
                width: 190px;
            }

            .logo {
                font-size: clamp(26px, 5vw, 36px);
            }

            .login {
                padding: 0 14px;
            }
        }

        /* =====================================================
           RESPONSIVIDADE - 650PX
        ===================================================== */
        @media (max-width: 650px) {
            .barra-categorias ul {
                justify-content: flex-start;
                gap: 25px;
                padding: 0 18px;
            }

            .barra-categorias a {
                padding: 13px 2px;
                font-size: 13px;
            }

            header {
                min-height: 70px;
            }

            .topo {
                min-height: 70px;
                padding: 0 12px;
                column-gap: 10px;
            }

            .buscar-topo {
                display: none;
            }

            .hamburguer {
                width: 42px;
                height: 42px;
            }

            .logo {
                font-size: 25px;
                letter-spacing: 1px;
            }

            .login {
                min-height: 36px;
                padding: 0 11px;
                font-size: 10px;
            }

            .login span {
                display: none;
            }

            .login i {
                font-size: 15px;
            }

            .menu {
                width: 270px;
                max-width: calc(100vw - 24px);
                max-height: calc(100vh - 90px);
            }

            .modal-atalhos {
                padding: 20px;
            }
        }

        /* =====================================================
           RESPONSIVIDADE - 380PX
        ===================================================== */
        @media (max-width: 380px) {
            .topo {
                padding: 0 9px;
            }

            .hamburguer {
                width: 39px;
                height: 39px;
            }

            .hamburguer span {
                width: 20px;
            }

            .logo {
                font-size: 21px;
            }

            .login {
                min-width: 38px;
                width: 38px;
                padding: 0;
            }

            .barra-categorias ul {
                gap: 20px;
            }
        }

        /* =====================================================
           REDUÇÃO DE MOVIMENTO
        ===================================================== */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

    <!-- =====================================================
         BARRA DE CATEGORIAS
    ===================================================== -->
    <nav class="barra-categorias" aria-label="Navegação principal">
        <ul>
            <li><a href="/design_site/01-Home/index.html">Início</a>

            <li><a href="/design_site/02-Inovações/index.html">Inovações</a></li>
            <li><a href="/design_site/03-Lancamentos/index.html">Lançamentos</a></li>

        </ul>
    </nav>

    <!-- =====================================================
         HEADER
    ===================================================== -->
    <header>
        <div class="topo">

            <!-- =================================================
                 ESQUERDA
            ================================================= -->
            <div class="topo-esquerdo">

                <!-- MENU -->
                <div class="menu-hamburguer">
                    <button class="hamburguer" id="btnMenu" type="button" aria-label="Abrir menu de acessibilidade"
                        aria-expanded="false" aria-controls="menu">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>

                    <!-- MENU DE ACESSIBILIDADE -->
                    <ul class="menu" id="menu" aria-hidden="true">

                        <li class="menu-titulo">
                            <i class="fa-solid fa-universal-access"></i>
                            <span>Acessibilidade</span>
                        </li>

                        <!-- MODO ESCURO -->
                        <li>
                            <button class="menu-opcao" id="btnDarkMenu" type="button">
                                <i class="fa-solid fa-moon"></i>
                                <span>Modo Escuro</span>
                                <span class="status" id="statusDark">OFF</span>
                            </button>
                        </li>

                        <!-- AUMENTAR -->
                        <li>
                            <button class="menu-opcao" id="btnAumentarTexto" type="button">
                                <i class="fa-solid fa-font"></i>
                                <span>Aumentar texto</span>
                                <span class="status">A+</span>
                            </button>
                        </li>

                        <!-- DIMINUIR -->
                        <li>
                            <button class="menu-opcao" id="btnDiminuirTexto" type="button">
                                <i class="fa-solid fa-font"></i>
                                <span>Diminuir texto</span>
                                <span class="status">A−</span>
                            </button>
                        </li>

                        <!-- DESTACAR LINKS -->
                        <li>
                            <button class="menu-opcao" id="btnDestacarLinks" type="button">
                                <i class="fa-solid fa-link"></i>
                                <span>Destacar links</span>
                                <span class="status" id="statusLinks">OFF</span>
                            </button>
                        </li>

                        <!-- MODO LEITURA -->
                        <li>
                            <button class="menu-opcao" id="btnModoLeitura" type="button">
                                <i class="fa-solid fa-book-open"></i>
                                <span>Modo de leitura</span>
                                <span class="status" id="statusLeitura">OFF</span>
                            </button>
                        </li>

                        <!-- ATALHOS -->
                        <li>
                            <button class="menu-opcao" id="btnAtalhos" type="button">
                                <i class="fa-solid fa-keyboard"></i>
                                <span>Atalhos de teclado</span>
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </li>

                        <!-- DALTONISMO -->
                        <li>
                            <button class="menu-opcao" id="btnDaltonismo" type="button" aria-expanded="false"
                                aria-controls="submenuDaltonismo">
                                <i class="fa-solid fa-palette"></i>
                                <span>Daltonismo</span>
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </li>

                        <!-- SUBMENU -->
                        <li>
                            <div class="submenu-acessibilidade" id="submenuDaltonismo">
                                <button type="button" data-daltonismo="normal">Normal</button>
                                <button type="button" data-daltonismo="protanopia">Protanopia</button>
                                <button type="button" data-daltonismo="deuteranopia">Deuteranopia</button>
                                <button type="button" data-daltonismo="tritanopia">Tritanopia</button>
                            </div>
                        </li>

                        <li>
                            <div class="menu-separador"></div>
                        </li>

                        <!-- RESTAURAR -->
                        <li>
                            <button class="menu-opcao menu-restaurar" id="btnRestaurar" type="button">
                                <i class="fa-solid fa-rotate-left"></i>
                                <span>Restaurar configurações</span>
                            </button>
                        </li>
                    </ul>
                </div>

                <!-- =================================================
                     BUSCA
                ================================================= -->
                <div class="buscar-topo">
                    <label class="sr-only" for="campoBusca">Buscar notícias</label>
                    <input id="campoBusca" type="search" placeholder="Buscar notícias..." autocomplete="off">
                    <button class="limpar-busca" id="limparBusca" type="button" aria-label="Limpar busca">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <!-- =================================================
                 LOGO
            ================================================= -->
            <a href="/design_site/01-Home/index.html" class="logo" aria-label="TechNews - Ir para a página inicial">
                Tech<span>News</span>
            </a>

            <!-- =================================================
                 LOGIN
            ================================================= -->
            <a href="/login.html" class="login">
                <i class="fa-solid fa-user"></i>
                <span>ENTRAR</span>
            </a>
        </div>
    </header>

    <!-- =====================================================
         MODAL DE ATALHOS
    ===================================================== -->
    <div class="modal-overlay" id="modalAtalhos" role="dialog" aria-modal="true" aria-labelledby="tituloAtalhos">
        <div class="modal-atalhos">
            <div class="modal-cabecalho">
                <h2 id="tituloAtalhos">
                    <i class="fa-solid fa-keyboard"></i>
                    Atalhos de teclado
                </h2>

                <button class="fechar-modal" id="fecharModal" type="button" aria-label="Fechar atalhos">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="atalhos-lista">
                <div class="atalho-item">
                    <span>Ir para a Home</span>
                    <kbd>Alt + H</kbd>
                </div>

                <div class="atalho-item">
                    <span>Focar na busca</span>
                    <kbd>Alt + B</kbd>
                </div>

                <div class="atalho-item">
                    <span>Abrir/fechar menu</span>
                    <kbd>Alt + M</kbd>
                </div>

                <div class="atalho-item">
                    <span>Aumentar texto</span>
                    <kbd>Alt + +</kbd>
                </div>

                <div class="atalho-item">
                    <span>Diminuir texto</span>
                    <kbd>Alt + −</kbd>
                </div>

                <div class="atalho-item">
                    <span>Modo de leitura</span>
                    <kbd>Alt + R</kbd>
                </div>

                <div class="atalho-item">
                    <span>Fechar menu/modal</span>
                    <kbd>Esc</kbd>
                </div>
            </div>
        </div>
    </div>

    <!-- =====================================================
         JAVASCRIPT
    ===================================================== -->
    <script>
        const body = document.body;
        const btnMenu = document.getElementById("btnMenu");
        const menu = document.getElementById("menu");
        const btnDarkMenu = document.getElementById("btnDarkMenu");
        const statusDark = document.getElementById("statusDark");
        const btnAumentarTexto = document.getElementById("btnAumentarTexto");
        const btnDiminuirTexto = document.getElementById("btnDiminuirTexto");
        const btnDestacarLinks = document.getElementById("btnDestacarLinks");
        const statusLinks = document.getElementById("statusLinks");
        const btnModoLeitura = document.getElementById("btnModoLeitura");
        const statusLeitura = document.getElementById("statusLeitura");
        const btnAtalhos = document.getElementById("btnAtalhos");
        const btnDaltonismo = document.getElementById("btnDaltonismo");
        const submenuDaltonismo = document.getElementById("submenuDaltonismo");
        const btnRestaurar = document.getElementById("btnRestaurar");
        const modalAtalhos = document.getElementById("modalAtalhos");
        const fecharModal = document.getElementById("fecharModal");
        const campoBusca = document.getElementById("campoBusca");
        const limparBusca = document.getElementById("limparBusca");

        const CLASSES_DALTONISMO = [
            "daltonismo-protanopia",
            "daltonismo-deuteranopia",
            "daltonismo-tritanopia"
        ];

        const TIPOS_DALTONISMO = [
            "normal",
            "protanopia",
            "deuteranopia",
            "tritanopia"
        ];

        const NIVEIS_TEXTO = [85, 100, 120, 140, 160];
        let nivelTexto = 100;

        /* =====================================================
           MENU
        ===================================================== */
        function abrirMenu() {
            const aberto = !menu.classList.contains("ativo");

            menu.classList.toggle("ativo", aberto);
            btnMenu.classList.toggle("ativo", aberto);
            btnMenu.setAttribute("aria-expanded", String(aberto));
            btnMenu.setAttribute("aria-label", aberto ? "Fechar menu de acessibilidade" : "Abrir menu de acessibilidade");
            menu.setAttribute("aria-hidden", String(!aberto));
        }

        function fecharMenu() {
            menu.classList.remove("ativo");
            btnMenu.classList.remove("ativo");
            btnMenu.setAttribute("aria-expanded", "false");
            btnMenu.setAttribute("aria-label", "Abrir menu de acessibilidade");
            menu.setAttribute("aria-hidden", "true");
        }

        btnMenu.addEventListener("click", event => {
            event.stopPropagation();
            abrirMenu();
        });

        menu.addEventListener("click", event => {
            event.stopPropagation();
        });

        document.addEventListener("click", event => {
            if (!menu.contains(event.target) && !btnMenu.contains(event.target)) {
                fecharMenu();
            }
        });

        /* =====================================================
           BUSCA
        ===================================================== */
        campoBusca.addEventListener("input", () => {
            limparBusca.classList.toggle("visivel", campoBusca.value.length > 0);
        });

        limparBusca.addEventListener("click", () => {
            campoBusca.value = "";
            limparBusca.classList.remove("visivel");
            campoBusca.focus();
        });

        /* =====================================================
           MODO ESCURO
        ===================================================== */
        btnDarkMenu.addEventListener("click", () => {
            body.classList.toggle("dark");
            atualizarStatus();
            salvarConfiguracoes();
        });

        /* =====================================================
           TEXTO
        ===================================================== */
        function aplicarNivelTexto(nivel) {
            nivel = Math.max(85, Math.min(160, nivel));

            nivel = NIVEIS_TEXTO.reduce((maisProximo, valor) => {
                return Math.abs(valor - nivel) < Math.abs(maisProximo - nivel) ? valor : maisProximo;
            }, 100);

            nivelTexto = nivel;

            body.classList.remove(
                "texto-85",
                "texto-100",
                "texto-120",
                "texto-140",
                "texto-160"
            );

            body.classList.add(`texto-${nivelTexto}`);
        }

        function aumentarTexto() {
            const indice = NIVEIS_TEXTO.indexOf(nivelTexto);

            if (indice < NIVEIS_TEXTO.length - 1) {
                aplicarNivelTexto(NIVEIS_TEXTO[indice + 1]);
            }

            atualizarStatus();
            salvarConfiguracoes();
        }

        function diminuirTexto() {
            const indice = NIVEIS_TEXTO.indexOf(nivelTexto);

            if (indice > 0) {
                aplicarNivelTexto(NIVEIS_TEXTO[indice - 1]);
            }

            atualizarStatus();
            salvarConfiguracoes();
        }

        btnAumentarTexto.addEventListener("click", aumentarTexto);
        btnDiminuirTexto.addEventListener("click", diminuirTexto);

        /* =====================================================
           STATUS
        ===================================================== */
        function atualizarStatus() {
            const escuro = body.classList.contains("dark");
            const links = body.classList.contains("destacar-links");
            const leitura = body.classList.contains("modo-leitura");

            statusDark.textContent = escuro ? "ON" : "OFF";
            statusLinks.textContent = links ? "ON" : "OFF";
            statusLeitura.textContent = leitura ? "ON" : "OFF";

            btnDarkMenu.classList.toggle("ativo", escuro);
            btnDestacarLinks.classList.toggle("ativo", links);
            btnModoLeitura.classList.toggle("ativo", leitura);

            btnDarkMenu.querySelector("i").className =
                escuro ? "fa-solid fa-sun" : "fa-solid fa-moon";

            btnDarkMenu.querySelector("span").textContent =
                escuro ? "Modo Claro" : "Modo Escuro";

            btnAumentarTexto.querySelector(".status").textContent =
                nivelTexto >= 160 ? "MAX" : "A+";

            btnDiminuirTexto.querySelector(".status").textContent =
                nivelTexto <= 85 ? "MIN" : "A−";
        }

        /* =====================================================
           CONFIGURAÇÕES
        ===================================================== */
        function salvarConfiguracoes() {
            const configuracoes = {
                dark: body.classList.contains("dark"),
                texto: nivelTexto,
                links: body.classList.contains("destacar-links"),
                leitura: body.classList.contains("modo-leitura")
            };

            try {
                localStorage.setItem(
                    "techNewsAcessibilidade",
                    JSON.stringify(configuracoes)
                );
            } catch (erro) {
                console.warn(
                    "Não foi possível salvar as configurações.",
                    erro
                );
            }
        }

        function carregarConfiguracoes() {
            try {
                const dados = JSON.parse(
                    localStorage.getItem("techNewsAcessibilidade")
                );

                if (!dados) {
                    aplicarNivelTexto(100);
                    atualizarStatus();
                    return;
                }

                body.classList.toggle("dark", Boolean(dados.dark));
                body.classList.toggle("destacar-links", Boolean(dados.links));
                body.classList.toggle("modo-leitura", Boolean(dados.leitura));

                aplicarNivelTexto(Number(dados.texto) || 100);
                atualizarStatus();
            } catch (erro) {
                aplicarNivelTexto(100);
                atualizarStatus();
            }
        }

        /* =====================================================
           DESTACAR LINKS
        ===================================================== */
        btnDestacarLinks.addEventListener("click", () => {
            body.classList.toggle("destacar-links");
            atualizarStatus();
            salvarConfiguracoes();
        });

        /* =====================================================
           MODO LEITURA
        ===================================================== */
        btnModoLeitura.addEventListener("click", () => {
            body.classList.toggle("modo-leitura");
            atualizarStatus();
            salvarConfiguracoes();
        });

        /* =====================================================
           DALTONISMO
        ===================================================== */
        function aplicarDaltonismo(tipo) {
            if (!TIPOS_DALTONISMO.includes(tipo)) {
                tipo = "normal";
            }

            body.classList.remove(...CLASSES_DALTONISMO);

            if (tipo !== "normal") {
                body.classList.add(`daltonismo-${tipo}`);
            }

            submenuDaltonismo.querySelectorAll("button").forEach(botao => {
                const ativo = botao.dataset.daltonismo === tipo;

                botao.classList.toggle("ativo", ativo);
                botao.setAttribute("aria-pressed", String(ativo));
            });
        }

        btnDaltonismo.addEventListener("click", () => {
            const aberto = !submenuDaltonismo.classList.contains("ativo");

            submenuDaltonismo.classList.toggle("ativo", aberto);
            btnDaltonismo.setAttribute("aria-expanded", String(aberto));
        });

        submenuDaltonismo.querySelectorAll("button").forEach(botao => {
            botao.addEventListener("click", () => {
                aplicarDaltonismo(botao.dataset.daltonismo);
                salvarConfiguracoes();
            });
        });

        /* =====================================================
           RESTAURAR
        ===================================================== */
        btnRestaurar.addEventListener("click", () => {
            body.classList.remove(
                "dark",
                "destacar-links",
                "modo-leitura",
                ...CLASSES_DALTONISMO
            );

            aplicarNivelTexto(100);
            aplicarDaltonismo("normal");

            submenuDaltonismo.classList.remove("ativo");
            btnDaltonismo.setAttribute("aria-expanded", "false");

            atualizarStatus();
            salvarConfiguracoes();
        });

        /* =====================================================
           MODAL
        ===================================================== */
        function abrirAtalhos() {
            fecharMenu();
            modalAtalhos.classList.add("ativo");
            fecharModal.focus();
        }

        function fecharAtalhos() {
            modalAtalhos.classList.remove("ativo");
            btnMenu.focus();
        }

        btnAtalhos.addEventListener("click", abrirAtalhos);
        fecharModal.addEventListener("click", fecharAtalhos);

        modalAtalhos.addEventListener("click", event => {
            if (event.target === modalAtalhos) {
                fecharAtalhos();
            }
        });

        /* =====================================================
           TECLADO
        ===================================================== */
        document.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                fecharMenu();

                if (modalAtalhos.classList.contains("ativo")) {
                    fecharAtalhos();
                }
            }

            if (event.altKey && !event.ctrlKey && !event.shiftKey) {
                const tecla = event.key.toLowerCase();

                if (tecla === "h") {
                    event.preventDefault();
                    window.location.href = "index.html";
                }

                if (tecla === "b") {
                    event.preventDefault();
                    campoBusca.focus();
                }

                if (tecla === "m") {
                    event.preventDefault();
                    abrirMenu();
                }

                if (event.key === "+" || event.key === "=") {
                    event.preventDefault();
                    aumentarTexto();
                }

                if (event.key === "-" || event.key === "_") {
                    event.preventDefault();
                    diminuirTexto();
                }

                if (tecla === "r") {
                    event.preventDefault();
                    body.classList.toggle("modo-leitura");
                    atualizarStatus();
                    salvarConfiguracoes();
                }
            }
        });

        /* =====================================================
           INICIALIZAÇÃO
        ===================================================== */
        carregarConfiguracoes();
    </script>

</body>

</html>
